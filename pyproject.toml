[project]
name = "myrient-download"
version = "1.2.0"
description = "Download .zips from Myrient via HTTPS"
authors = [
    { name = "Tucker Warlock" },
    { name = "Kieran Gee", email = "kieran.lost.the.game@gmail.com" },
    { name = "Trent Neilson" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.13.4",
    "colorama>=0.4.6",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "tomlkit>=0.13.2",
    "tqdm>=4.67.1",
    "uvloop>=0.22.1; sys_platform != 'win32'",
]

[dependency-groups]
type = [
    "mypy>=1.15.0",
    "types-colorama>=0.4.15.20240311",
    "types-tqdm>=4.67.0.20250417",
]
lint = ["ruff>=0.9.7"]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-random-order",
    "pytest-asyncio>=0.24",
    "detect-test-pollution",
]

[tool.uv]
default-groups = ["type", "lint", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myrient_download"]

[project.scripts]
myrient-download = "myrient_download.__main__:main"

[project.urls]
"Homepage" = "https://github.com/TuckerWarlock/myrient-download"

[tool.ruff]
cache-dir = "~/.cache/ruff"
target-version = "py314"
line-length = 120

[tool.ruff.lint]
extend-fixable = ["B", "I001"]
extend-unsafe-fixes = ["F401"]
select = ["ALL"]
ignore = [
    "DJ",
    "DTZ",
    "TD002",
    "TD003",
    "ISC001",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ARG", "FBT", "ANN", "D",
    "S101", "SLF001", "INP001", "PT004",
    "S311", "S105", "PLR0913", "BLE001",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 40

[tool.pytest.ini_options]
addopts = [
    "--cov-context=test",
    "--cov=myrient_download",
    "--cov-report=term",
    "--cov-report=html",
    "--ignore=tests/test_gui.py",
]
testpaths = ["tests"]

[tool.coverage.html]
show_contexts = true

[tool.mypy]
files = ["myrient_download"]
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
strict = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "type-arg",
]
exclude = ["tests/*"]
